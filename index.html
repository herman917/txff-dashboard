<!DOCTYPE html>
<html lang="zh-Hant" class="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>台指期 (TXFF) 即時多空力道看盤系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: 'Inter', 'Noto Sans TC', system-ui, -apple-system, sans-serif;
      background-color: #070b14;
      color: #e2e8f0;
    }

    .tabular-nums {
      font-variant-numeric: tabular-nums;
    }

    /* 自訂捲軸 */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: #0f172a;
    }

    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 3px;
    }
  </style>
</head>

<body class="min-h-screen antialiased selection:bg-rose-500/30 selection:text-rose-200">
  <div class="max-w-6xl mx-auto px-4 py-4 sm:py-6 space-y-4">

    <!-- 頂部狀態與總覽區 -->
    <header class="bg-slate-900/90 border border-slate-800 rounded-xl p-4 sm:p-5 shadow-2xl">
      <div class="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4">
        <!-- 左側：指數名稱與即時報價 -->
        <div class="flex flex-wrap items-baseline gap-x-5 gap-y-2">
          <div>
            <div class="flex flex-wrap items-center gap-2">
              <!-- 標的二選一切換器 -->
              <div class="inline-flex rounded-lg bg-slate-950 p-0.5 border border-slate-800" role="group">
                <button id="btn-target-TXFF" onclick="switchTarget('TXFF')"
                  class="px-2.5 py-1 text-xs font-semibold rounded-md bg-sky-600 text-white transition cursor-pointer">
                  台指期 (TXFF)
                </button>
                <button id="btn-target-TWII" onclick="switchTarget('TWII')"
                  class="px-2.5 py-1 text-xs font-semibold rounded-md text-slate-400 hover:text-slate-200 transition cursor-pointer">
                  台股大盤 (^TWII)
                </button>
              </div>
              <div class="inline-flex items-center gap-1">
                <input id="stock-code-input" type="text" placeholder="台股代號 (例: 2330)" maxlength="10"
                  onkeydown="if(event.key==='Enter') queryStockCode()"
                  class="w-32 px-2 py-1 text-xs rounded-md bg-slate-950 border border-slate-700 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-sky-500" />
                <button onclick="queryStockCode()"
                  class="px-2.5 py-1 text-xs font-semibold rounded-md bg-slate-800 hover:bg-slate-700 text-sky-300 border border-slate-700 transition cursor-pointer">
                  查詢
                </button>
              </div>
              <h1 id="index-title" class="text-lg sm:text-xl font-bold text-slate-100">台指期近月 (TXFF)</h1>
              <span id="market-status-badge"
                class="inline-flex items-center gap-1.5 text-xs font-medium px-2.5 py-0.5 rounded-full bg-amber-500/15 text-amber-300 border border-amber-500/30">
                <span id="market-status-dot" class="w-2 h-2 rounded-full bg-amber-400"></span>
                <span id="market-status-text">連線中...</span>
              </span>
            </div>
          </div>

          <div class="flex items-baseline gap-3 tabular-nums">
            <span id="index-price" class="text-3xl sm:text-4xl font-extrabold tracking-tight text-slate-100">
              --
            </span>
            <div id="index-change-wrap" class="flex items-center gap-2 text-base sm:text-lg font-bold text-slate-400">
              <span id="index-change">--</span>
              <span id="index-change-pct" class="text-sm sm:text-base px-2 py-0.5 rounded bg-slate-800">--</span>
            </div>
          </div>
        </div>

        <!-- 右側：更新時間、倒數進度條與控制鈕 -->
        <div class="flex flex-col sm:flex-row sm:items-center gap-3 lg:text-right">
          <div class="space-y-1 text-xs text-slate-400 tabular-nums">
            <div>
              資料時間：<span id="market-time" class="text-slate-200 font-medium">--</span>
              <span class="mx-1.5 text-slate-600">|</span>
              最後更新：<span id="last-fetched" class="text-slate-200 font-medium">--</span>
            </div>
            <div class="flex items-center gap-2">
              <label for="interval-select" class="text-slate-400 whitespace-nowrap">更新週期</label>
              <select id="interval-select" onchange="changeRefreshInterval(this.value)"
                class="bg-slate-800 border border-slate-700 text-slate-200 text-xs rounded px-1.5 py-0.5 focus:outline-none focus:border-sky-500 cursor-pointer">
                <option value="30" selected>30 秒</option>
                <option value="60">1 分鐘</option>
                <option value="900">15 分鐘</option>
              </select>
              <span class="text-slate-300 whitespace-nowrap w-12 text-right">(<span
                  id="countdown-sec">30s</span>)</span>
              <div class="w-full sm:w-28 h-1.5 bg-slate-800 rounded-full overflow-hidden">
                <div id="countdown-bar" class="h-full bg-sky-500 transition-all duration-100 ease-linear"
                  style="width: 100%"></div>
              </div>
            </div>
          </div>

          <div class="flex items-center gap-2">
            <button id="btn-refresh" onclick="manualRefresh()"
              class="px-3 py-1.5 text-xs font-medium rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 transition cursor-pointer">
              立即更新
            </button>
          </div>
        </div>
      </div>
    </header>

    <!-- 5 週期多空力道矩陣（核心看板） -->
    <main class="bg-slate-900/90 border border-slate-800 rounded-xl overflow-hidden shadow-2xl">
      <div class="px-4 py-3 border-b border-slate-800 flex flex-wrap items-center justify-between gap-2 bg-slate-900">
        <div class="flex items-center gap-2">
          <h2 class="text-sm sm:text-base font-bold text-slate-100">多週期多空力道矩陣（15分 / 30分 / 時 / 日 / 週）</h2>
        </div>
        <div class="flex items-center gap-3 text-xs text-slate-400">
          <span class="inline-flex items-center gap-1"><span
              class="w-2.5 h-2.5 rounded-sm bg-emerald-500 inline-block"></span> 陰（連黑 &ge; 2）</span>
          <span class="inline-flex items-center gap-1"><span
              class="w-2.5 h-2.5 rounded-sm bg-slate-500 inline-block"></span> 盤整（僅 1 根）</span>
          <span class="inline-flex items-center gap-1"><span
              class="w-2.5 h-2.5 rounded-sm bg-rose-500 inline-block"></span> 陽（連紅 &ge; 2）</span>
        </div>
      </div>

      <!-- 表頭 (桌機版) -->
      <div
        class="hidden md:grid grid-cols-12 gap-3 px-4 py-2.5 text-xs font-semibold text-slate-400 bg-slate-950/60 border-b border-slate-800/80">
        <div class="col-span-3">週期 / 最新收盤</div>
        <div class="col-span-2 text-center">狀態</div>
        <div class="col-span-7">縮小 K 線走勢 &amp; 反轉訊號</div>
      </div>

      <!-- 7 列矩陣內容 -->
      <div id="matrix-rows" class="divide-y divide-slate-800/80">
        <div class="p-8 text-center text-sm text-slate-500">正在載入 7 週期 K 線與量化指標...</div>
      </div>
    </main>

    <!-- 底部說明 -->
    <footer class="text-xs text-slate-500 flex flex-wrap items-center justify-between gap-2 px-1">
      <div>
        資料來源：<span id="data-source">--</span> ｜ 十字線（收=開）自動延續前一根 K 線顏色狀態
      </div>
      <div id="market-hours-note">
        台指期交易時段：日盤 08:45 ~ 13:45 ｜ 夜盤 15:00 ~ 05:00（非盤中自動切換快取狀態）
      </div>
    </footer>
  </div>

  <script>
    const ALLOWED_INTERVALS = [30, 60, 900];
    const ALLOWED_TARGETS = ['TXFF', 'TWII'];
    let refreshIntervalMs = 30000;
    const MAX_STREAK_BARS = 8; // 雙向進度條滿格上限（8 根）
    let countdownRemainingMs = refreshIntervalMs;
    let lastTickTime = Date.now();
    let isFetching = false;
    let currentThresholdsPct = {};

    // 初始化：讀取儲存的標的與更新週期、抓一次資料並啟動輪詢與平滑進度條
    document.addEventListener('DOMContentLoaded', async () => {
      const savedSec = parseInt(localStorage.getItem('txff_refresh_interval_sec'), 10);
      if (ALLOWED_INTERVALS.includes(savedSec)) {
        refreshIntervalMs = savedSec * 1000;
        countdownRemainingMs = refreshIntervalMs;
        document.getElementById('interval-select').value = String(savedSec);
        syncIntervalToBackend(savedSec);
      }

      const savedTarget = localStorage.getItem('txff_active_target');
      if (ALLOWED_TARGETS.includes(savedTarget) && savedTarget !== 'TXFF') {
        await switchTarget(savedTarget);
      } else {
        fetchMarketData();
      }
      setInterval(updateCountdownLoop, 100);
    });

    function updateTargetButtonsUI(target) {
      const btnTxf = document.getElementById('btn-target-TXFF');
      const btnTwii = document.getElementById('btn-target-TWII');
      const hoursNote = document.getElementById('market-hours-note');

      const activeCls = 'px-2.5 py-1 text-xs font-semibold rounded-md bg-sky-600 text-white transition cursor-pointer';
      const inactiveCls = 'px-2.5 py-1 text-xs font-semibold rounded-md text-slate-400 hover:text-slate-200 transition cursor-pointer';

      if (target === 'TWII') {
        btnTxf.className = inactiveCls;
        btnTwii.className = activeCls;
        hoursNote.textContent = '台股大盤交易時段：週一至週五 09:00 ~ 13:30（非盤中自動切換快取狀態）';
      } else {
        btnTxf.className = activeCls;
        btnTwii.className = inactiveCls;
        hoursNote.textContent = '台指期交易時段：日盤 08:45 ~ 13:45 ｜ 夜盤 15:00 ~ 05:00（非盤中自動切換快取狀態）';
      }
    }

    async function queryStockCode() {
      const code = document.getElementById('stock-code-input').value.trim();
      if (!code) return;
      localStorage.setItem('txff_active_target', 'STOCK');
      localStorage.setItem('txff_stock_code', code);
      try {
        const res = await fetch('/api/target', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ target: 'STOCK', stock_code: code }),
        });
        if (res.ok) {
          const data = await res.json();
          renderDashboard(data);
          countdownRemainingMs = refreshIntervalMs;
          lastTickTime = Date.now();
        }
      } catch (err) {
        console.error('查詢個股失敗:', err);
      }
    }

    async function switchTarget(target) {
      if (!ALLOWED_TARGETS.includes(target)) return;
      localStorage.setItem('txff_active_target', target);
      updateTargetButtonsUI(target);
      try {
        const res = await fetch('/api/target', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ target }),
        });
        if (res.ok) {
          const data = await res.json();
          renderDashboard(data);
          countdownRemainingMs = refreshIntervalMs;
          lastTickTime = Date.now();
        }
      } catch (err) {
        console.error('切換標的失敗:', err);
      }
    }

    function formatCountdown(sec) {
      if (sec >= 60) {
        const m = Math.floor(sec / 60);
        const s = sec % 60;
        return s === 0 ? `${m}m` : `${m}m${String(s).padStart(2, '0')}s`;
      }
      return `${sec}s`;
    }

    async function syncIntervalToBackend(sec) {
      try {
        await fetch('/api/interval', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ interval_sec: sec }),
        });
      } catch (err) {
        console.error('同步更新週期失敗:', err);
      }
    }

    function changeRefreshInterval(val) {
      const sec = parseInt(val, 10);
      if (!ALLOWED_INTERVALS.includes(sec)) return;
      localStorage.setItem('txff_refresh_interval_sec', String(sec));
      refreshIntervalMs = sec * 1000;
      countdownRemainingMs = refreshIntervalMs;
      lastTickTime = Date.now();
      syncIntervalToBackend(sec);
    }

    function updateCountdownLoop() {
      const now = Date.now();
      const delta = now - lastTickTime;
      lastTickTime = now;
      countdownRemainingMs -= delta;

      if (countdownRemainingMs <= 0) {
        countdownRemainingMs = refreshIntervalMs;
        fetchMarketData();
      }

      const pct = Math.max(0, Math.min(100, (countdownRemainingMs / refreshIntervalMs) * 100));
      document.getElementById('countdown-bar').style.width = `${pct}%`;
      document.getElementById('countdown-sec').textContent = formatCountdown(Math.ceil(countdownRemainingMs / 1000));
    }

    async function fetchMarketData() {
      if (isFetching) return;
      isFetching = true;
      try {
        const res = await fetch('/api/market');
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        renderDashboard(data);
      } catch (err) {
        console.error('抓取市場資料失敗:', err);
        setStatusBadge(false, true, '連線異常（保留快取）');
      } finally {
        isFetching = false;
      }
    }

    async function manualRefresh() {
      const btn = document.getElementById('btn-refresh');
      btn.disabled = true;
      btn.textContent = '更新中...';
      try {
        const res = await fetch('/api/refresh', { method: 'POST' });
        if (res.ok) {
          const data = await res.json();
          renderDashboard(data);
          countdownRemainingMs = refreshIntervalMs;
        }
      } catch (err) {
        console.error('手動更新失敗:', err);
      } finally {
        btn.disabled = false;
        btn.textContent = '立即更新';
      }
    }

    function setStatusBadge(isMarketOpen, isCached, text) {
      const badge = document.getElementById('market-status-badge');
      const dot = document.getElementById('market-status-dot');
      const label = document.getElementById('market-status-text');
      label.textContent = text;

      if (isMarketOpen && !isCached) {
        badge.className = 'inline-flex items-center gap-1.5 text-xs font-medium px-2.5 py-0.5 rounded-full bg-emerald-500/15 text-emerald-300 border border-emerald-500/30';
        dot.className = 'w-2 h-2 rounded-full bg-emerald-400 animate-pulse';
      } else {
        badge.className = 'inline-flex items-center gap-1.5 text-xs font-medium px-2.5 py-0.5 rounded-full bg-amber-500/15 text-amber-300 border border-amber-500/30';
        dot.className = 'w-2 h-2 rounded-full bg-amber-400';
      }
    }

    function formatNumber(num) {
      if (num === null || num === undefined || isNaN(num)) return '--';
      return Number(num).toLocaleString('en-US', {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2,
      });
    }

    function renderDashboard(data) {
      const { active_target, quote, timeframes, thresholds_pct } = data;

      if (active_target) {
        updateTargetButtonsUI(active_target);
      }

      // 1. 頂部總覽區
      if (quote.name) {
        document.getElementById('index-title').textContent = quote.name;
      }
      const priceEl = document.getElementById('index-price');
      const changeEl = document.getElementById('index-change');
      const changePctEl = document.getElementById('index-change-pct');
      const changeWrap = document.getElementById('index-change-wrap');

      priceEl.textContent = formatNumber(quote.price);

      const chg = quote.change || 0;
      const chgPct = quote.change_pct || 0;
      const sign = chg > 0 ? '+' : '';

      changeEl.textContent = `${sign}${formatNumber(chg)}`;
      changePctEl.textContent = `${sign}${chgPct.toFixed(2)}%`;

      if (chg > 0) {
        priceEl.className = 'text-3xl sm:text-4xl font-extrabold tracking-tight text-rose-400';
        changeWrap.className = 'flex items-center gap-2 text-base sm:text-lg font-bold text-rose-400';
        changePctEl.className = 'text-sm sm:text-base px-2 py-0.5 rounded bg-rose-500/15 border border-rose-500/30 text-rose-300';
      } else if (chg < 0) {
        priceEl.className = 'text-3xl sm:text-4xl font-extrabold tracking-tight text-emerald-400';
        changeWrap.className = 'flex items-center gap-2 text-base sm:text-lg font-bold text-emerald-400';
        changePctEl.className = 'text-sm sm:text-base px-2 py-0.5 rounded bg-emerald-500/15 border border-emerald-500/30 text-emerald-300';
      } else {
        priceEl.className = 'text-3xl sm:text-4xl font-extrabold tracking-tight text-slate-100';
        changeWrap.className = 'flex items-center gap-2 text-base sm:text-lg font-bold text-slate-400';
        changePctEl.className = 'text-sm sm:text-base px-2 py-0.5 rounded bg-slate-800 text-slate-300';
      }

      setStatusBadge(quote.is_market_open, quote.is_cached, quote.status_text);
      document.getElementById('market-time').textContent = quote.market_time || '--';
      document.getElementById('last-fetched').textContent = quote.last_fetched_at || '--';
      document.getElementById('data-source').textContent = quote.source || '--';

      // 2. 渲染 5 週期多空力道矩陣
      const container = document.getElementById('matrix-rows');
      container.innerHTML = timeframes.map(renderTimeframeRow).join('');
    }

    function getPatternSvg(pattern) {
      const svgs = {
        '鎚子': '<svg width="32" height="22" viewBox="0 0 28 20"><line x1="14" y1="2" x2="14" y2="18" stroke="#fb7185" stroke-width="1.8"/><rect x="10" y="2" width="8" height="5" rx="1" fill="#f43f5e"/></svg>',
        '多頭吞噬': '<svg width="32" height="22" viewBox="0 0 28 20"><rect x="5" y="6" width="6" height="7" rx="1" fill="#10b981"/><line x1="19" y1="1" x2="19" y2="19" stroke="#fb7185" stroke-width="1.5"/><rect x="15" y="2" width="8" height="16" rx="1" fill="#f43f5e"/></svg>',
        '多頭貫穿': '<svg width="32" height="22" viewBox="0 0 28 20"><rect x="5" y="3" width="6" height="12" rx="1" fill="#10b981"/><line x1="2" y1="9" x2="26" y2="9" stroke="#fbbf24" stroke-width="1" stroke-dasharray="2,2"/><rect x="16" y="6" width="7" height="12" rx="1" fill="#f43f5e"/></svg>',
        '多頭島型反轉': '<svg width="32" height="22" viewBox="0 0 28 20"><rect x="2" y="2" width="5" height="6" rx="1" fill="#10b981"/><rect x="11.5" y="13" width="5" height="5" rx="1" fill="#fbbf24"/><rect x="21" y="2" width="5" height="7" rx="1" fill="#f43f5e"/><line x1="1" y1="10.5" x2="27" y2="10.5" stroke="#fbbf24" stroke-width="1" stroke-dasharray="2,2"/></svg>',
        '破底翻': '<svg width="32" height="22" viewBox="0 0 28 20"><line x1="2" y1="12" x2="26" y2="12" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="2,2"/><path d="M3,8 Q10,19 16,13 T25,4" fill="none" stroke="#f43f5e" stroke-width="2" stroke-linecap="round"/><polyline points="21,4 25,4 25,8" fill="none" stroke="#f43f5e" stroke-width="1.8" stroke-linecap="round"/></svg>',
        '流星': '<svg width="32" height="22" viewBox="0 0 28 20"><line x1="14" y1="2" x2="14" y2="18" stroke="#34d399" stroke-width="1.8"/><rect x="10" y="13" width="8" height="5" rx="1" fill="#10b981"/></svg>',
        '吊人': '<svg width="32" height="22" viewBox="0 0 28 20"><line x1="14" y1="2" x2="14" y2="18" stroke="#34d399" stroke-width="1.8"/><rect x="10" y="2" width="8" height="5" rx="1" fill="#10b981"/></svg>',
        '空頭吞噬': '<svg width="32" height="22" viewBox="0 0 28 20"><rect x="5" y="6" width="6" height="7" rx="1" fill="#f43f5e"/><line x1="19" y1="1" x2="19" y2="19" stroke="#34d399" stroke-width="1.5"/><rect x="15" y="2" width="8" height="16" rx="1" fill="#10b981"/></svg>',
        '烏雲罩日': '<svg width="32" height="22" viewBox="0 0 28 20"><rect x="5" y="5" width="6" height="12" rx="1" fill="#f43f5e"/><line x1="2" y1="11" x2="26" y2="11" stroke="#fbbf24" stroke-width="1" stroke-dasharray="2,2"/><rect x="16" y="2" width="7" height="12" rx="1" fill="#10b981"/></svg>',
        '空頭島型反轉': '<svg width="32" height="22" viewBox="0 0 28 20"><rect x="2" y="12" width="5" height="6" rx="1" fill="#f43f5e"/><rect x="11.5" y="2" width="5" height="5" rx="1" fill="#fbbf24"/><rect x="21" y="11" width="5" height="7" rx="1" fill="#10b981"/><line x1="1" y1="9.5" x2="27" y2="9.5" stroke="#fbbf24" stroke-width="1" stroke-dasharray="2,2"/></svg>',
        '假突破翻黑': '<svg width="32" height="22" viewBox="0 0 28 20"><line x1="2" y1="8" x2="26" y2="8" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="2,2"/><path d="M3,12 Q10,1 16,7 T25,16" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round"/><polyline points="21,16 25,16 25,12" fill="none" stroke="#10b981" stroke-width="1.8" stroke-linecap="round"/></svg>',
        '連2陽K': '<svg width="32" height="22" viewBox="0 0 28 20"><rect x="6" y="9" width="6" height="8" rx="1" fill="#f43f5e"/><rect x="16" y="4" width="6" height="10" rx="1" fill="#f43f5e"/></svg>',
        '連2陰K': '<svg width="32" height="22" viewBox="0 0 28 20"><rect x="6" y="4" width="6" height="8" rx="1" fill="#10b981"/><rect x="16" y="7" width="6" height="10" rx="1" fill="#10b981"/></svg>',
      };
      return svgs[pattern] || '';
    }

    function renderMiniKlineSvg(miniCandles, reversal) {
      if (!miniCandles || miniCandles.length === 0) return '<div class="text-xs text-slate-500">無 K 線資料</div>';
      const w = 220, h = 100, padTop = 15, padBot = 15;
      const hi = Math.max(...miniCandles.map(c => c.h));
      const lo = Math.min(...miniCandles.map(c => c.l));
      const span = Math.max(hi - lo, 0.01);
      const yOf = p => padTop + ((hi - p) / span) * (h - padTop - padBot);
      const step = w / miniCandles.length;
      const barW = Math.max(3.5, Math.min(9, step * 0.65));
      const coords = [];
      const elems = miniCandles.map((c, i) => {
        const cx = i * step + step / 2;
        const yo = yOf(c.o), yh = yOf(c.h), yl = yOf(c.l), yc = yOf(c.c);
        coords.push([cx, yh, yl]);
        const col = c.c > c.o ? '#f43f5e' : (c.c < c.o ? '#10b981' : '#94a3b8');
        const op = c.forming ? '0.55' : '1';
        const top = Math.min(yo, yc);
        const bh = Math.max(Math.abs(yc - yo), 2);
        return `<line x1="${cx.toFixed(1)}" y1="${yh.toFixed(1)}" x2="${cx.toFixed(1)}" y2="${yl.toFixed(1)}" stroke="${col}" stroke-width="1.3" opacity="${op}"/><rect x="${(cx - barW / 2).toFixed(1)}" y="${top.toFixed(1)}" width="${barW.toFixed(1)}" height="${bh.toFixed(1)}" rx="0.8" fill="${col}" opacity="${op}"/>`;
      });

      if (reversal && (reversal.signal === 'bull_reversal' || reversal.signal === 'bear_reversal')) {
        const hasForming = miniCandles[miniCandles.length - 1].forming ? 1 : 0;
        const revIdx = miniCandles.length - 1 - hasForming - (reversal.bars_ago || 0);
        if (revIdx >= 0 && revIdx < coords.length) {
          const [rx, ryh, ryl] = coords[revIdx];
          const tx = Math.max(22, Math.min(w - 22, rx));
          if (reversal.signal === 'bull_reversal') {
            const ly = Math.min(h - 3, ryl + 12);
            elems.push(`<line x1="${rx.toFixed(1)}" y1="${padTop - 4}" x2="${rx.toFixed(1)}" y2="${h - padBot + 2}" stroke="rgba(244,63,94,0.35)" stroke-width="1" stroke-dasharray="2,2"/>`);
            elems.push(`<text x="${tx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="middle" fill="#fda4af" font-size="9.5" font-weight="800">▲轉陽</text>`);
          } else {
            const ly = Math.max(10, ryh - 4);
            elems.push(`<line x1="${rx.toFixed(1)}" y1="${padTop - 2}" x2="${rx.toFixed(1)}" y2="${h - padBot + 4}" stroke="rgba(16,185,129,0.35)" stroke-width="1" stroke-dasharray="2,2"/>`);
            elems.push(`<text x="${tx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="middle" fill="#6ee7b7" font-size="9.5" font-weight="800">▼轉陰</text>`);
          }
        }
      }

      return `<svg width="100%" height="100" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" class="bg-slate-950 border border-slate-800 rounded-lg w-full">${elems.join('')}</svg>`;
    }

    function renderTimeframeRow(tf) {
      const { label, latest_candle, streak, reversal, mini_candles } = tf;

      let reversalHtml = '';
      if (reversal && reversal.signal !== 'none') {
        const patLabel = (reversal.pattern || '').replace(/多頭|空頭/g, '');
        if (reversal.signal === 'bull_reversal') {
          reversalHtml = `<div class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-rose-500/25 text-rose-200 border border-rose-500/70 shadow-md shadow-rose-500/40 ring-1 ring-rose-400/70"><span class="w-2 h-2 rounded-full bg-rose-500 animate-ping"></span>${getPatternSvg(reversal.pattern)}<span>${patLabel}</span></div>`;
        } else if (reversal.signal === 'bear_reversal') {
          reversalHtml = `<div class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-emerald-500/25 text-emerald-200 border border-emerald-500/70 shadow-md shadow-emerald-500/40 ring-1 ring-emerald-400/70"><span class="w-2 h-2 rounded-full bg-emerald-500 animate-ping"></span>${getPatternSvg(reversal.pattern)}<span>${patLabel}</span></div>`;
        }
      }

      // 狀態標籤樣式
      let statusBadgeHtml = '';
      if (streak.status === '陽') {
        statusBadgeHtml = `<span class="inline-flex items-center justify-center w-12 py-1 rounded-md text-xs font-bold bg-rose-600 text-white shadow-sm shadow-rose-900/50">陽</span>`;
      } else if (streak.status === '陰') {
        statusBadgeHtml = `<span class="inline-flex items-center justify-center w-12 py-1 rounded-md text-xs font-bold bg-emerald-600 text-white shadow-sm shadow-emerald-900/50">陰</span>`;
      } else {
        statusBadgeHtml = `<span class="inline-flex items-center justify-center w-12 py-1 rounded-md text-xs font-bold bg-slate-700 text-slate-200 border border-slate-600">盤整</span>`;
      }

      // 比例顏色與創高/破底小圖示
      let ratioColor = 'text-slate-100';
      let ratioBadge = '';
      const ratioText = (ratio.display || '--').replace(' (創高)', '').replace(' (破底)', '');
      if (ratio.state === 'breakout') {
        ratioColor = 'text-rose-400';
        ratioBadge = `<span class="inline-flex items-center gap-1 ml-1.5 px-1.5 py-0.5 rounded text-[11px] font-bold bg-rose-500/20 text-rose-300 border border-rose-500/50"><svg width="14" height="12" viewBox="0 0 18 14"><line x1="1" y1="9" x2="17" y2="9" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="2,2"/><polyline points="3,12 9,6 15,2" fill="none" stroke="#f43f5e" stroke-width="2" stroke-linecap="round"/><polyline points="11,2 15,2 15,6" fill="none" stroke="#f43f5e" stroke-width="1.8" stroke-linecap="round"/></svg>創高</span>`;
      } else if (ratio.state === 'breakdown') {
        ratioColor = 'text-emerald-400';
        ratioBadge = `<span class="inline-flex items-center gap-1 ml-1.5 px-1.5 py-0.5 rounded text-[11px] font-bold bg-emerald-500/20 text-emerald-300 border border-emerald-500/50"><svg width="14" height="12" viewBox="0 0 18 14"><line x1="1" y1="5" x2="17" y2="5" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="2,2"/><polyline points="3,2 9,8 15,12" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round"/><polyline points="11,12 15,12 15,8" fill="none" stroke="#10b981" stroke-width="1.8" stroke-linecap="round"/></svg>破底</span>`;
      }

      // 雙向進度條計算（以 50% 為中心 0 軸，單側最大 50%）
      let barHtml = '';
      const absCount = streak.abs_streak || 0;
      const clampedCount = Math.min(absCount, MAX_STREAK_BARS);
      const widthPct = (clampedCount / MAX_STREAK_BARS) * 50; // 最大 50%

      if (streak.streak >= 2) {
        // 連續紅 K（陽）：從中心向右延伸紅色長條
        barHtml = `
          <div class="absolute top-1 bottom-1 left-1/2 rounded-r bg-gradient-to-r from-rose-600 to-rose-500 flex items-center justify-end pr-2 transition-all duration-300 shadow-sm shadow-rose-900/40"
               style="width: ${widthPct}%">
            <span class="text-[11px] font-bold text-white whitespace-nowrap drop-shadow">${streak.streak_label}</span>
          </div>
        `;
      } else if (streak.streak <= -2) {
        // 連續黑 K（陰）：從中心向左延伸綠色長條
        barHtml = `
          <div class="absolute top-1 bottom-1 rounded-l bg-gradient-to-l from-emerald-600 to-emerald-500 flex items-center justify-start pl-2 transition-all duration-300 shadow-sm shadow-emerald-900/40"
               style="right: 50%; width: ${widthPct}%">
            <span class="text-[11px] font-bold text-white whitespace-nowrap drop-shadow">${streak.streak_label}</span>
          </div>
        `;
      } else if (streak.streak === 1) {
        // 僅 1 根紅 K：微弱半格灰色/淡紅指示
        barHtml = `
          <div class="absolute top-1.5 bottom-1.5 left-1/2 rounded-r bg-slate-600/80 border-r-2 border-rose-400/70 flex items-center pl-1.5 transition-all duration-300"
               style="width: 6.25%">
          </div>
          <span class="absolute top-1/2 -translate-y-1/2 left-[57.5%] text-[11px] font-medium text-slate-400 whitespace-nowrap">1 紅（觀望）</span>
        `;
      } else if (streak.streak === -1) {
        // 僅 1 根黑 K：微弱半格灰色/淡綠指示
        barHtml = `
          <div class="absolute top-1.5 bottom-1.5 rounded-l bg-slate-600/80 border-l-2 border-emerald-400/70 transition-all duration-300"
               style="right: 50%; width: 6.25%">
          </div>
          <span class="absolute top-1/2 -translate-y-1/2 right-[57.5%] text-[11px] font-medium text-slate-400 whitespace-nowrap">1 黑（觀望）</span>
        `;
      } else {
        barHtml = `
          <span class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 text-[11px] text-slate-500">十字盤整</span>
        `;
      }

      const ohlcInfo = latest_candle
        ? `開 ${formatNumber(latest_candle.open)} / 收 ${formatNumber(latest_candle.close)}`
        : '無 K 線資料';

      const pivotNote = is_fallback_pivot ? ' (區間極值)' : '';

      const recentColors = tf.recent_colors || [];
      const formingColor = tf.forming_color;
      const colorMap = { red: '#f43f5e', green: '#10b981', doji: '#94a3b8' };
      const zhMap = { red: '紅', green: '黑', doji: '十' };
      const blocksHtml = recentColors.map(c =>
        `<span title="${zhMap[c] || ''}" class="inline-block w-4 h-3.5 rounded-sm" style="background:${colorMap[c] || '#64748b'}"></span>`
      ).join('');
      const formingHtml = formingColor
        ? `<span class="text-slate-600 mx-1">|</span><span class="inline-flex items-center gap-1 text-[11px] font-bold" style="color:${colorMap[formingColor]}"><span class="inline-block w-4 h-3.5 rounded-sm border-2 border-dashed" style="border-color:${colorMap[formingColor]}"></span>即時(${zhMap[formingColor]})</span>`
        : '';
      const stripHtml = `<div class="flex items-center flex-wrap gap-1 mt-1.5"><span class="text-[11px] text-slate-400 mr-1">近${recentColors.length}T:</span>${blocksHtml}${formingHtml}</div>`;

      const tfColorCls = streak.status === '陽' ? 'text-rose-400' : (streak.status === '陰' ? 'text-emerald-400' : 'text-slate-100');

      return `
        <div class="flex flex-col gap-2.5 px-4 py-3 hover:bg-slate-800/35 transition">
          <!-- 上方：週期 + 陰陽狀態 + 反轉亮燈 -->
          <div class="flex flex-wrap items-center gap-2.5">
            <span class="text-base font-bold ${tfColorCls} w-10">${label}</span>
            ${statusBadgeHtml}
            ${reversalHtml}
            <span class="ml-auto text-[11px] text-slate-500 tabular-nums">${ohlcInfo}</span>
          </div>
          <!-- 下方：縮小 K 線走勢圖 -->
          <div class="w-full tabular-nums">
            ${renderMiniKlineSvg(mini_candles, reversal)}
          </div>
        </div>
      `;
    }

    function toggleSettings() {
      const panel = document.getElementById('settings-panel');
      panel.classList.toggle('hidden');
    }

    function renderThresholdInputs(timeframes, thresholdsPct) {
      const container = document.getElementById('threshold-inputs');
      // 若使用者正在輸入中，不覆蓋現有 input
      if (container.children.length > 0 && container.contains(document.activeElement)) {
        return;
      }
      container.innerHTML = timeframes.map(tf => {
        const val = thresholdsPct[tf.timeframe] ?? tf.threshold_pct;
        return `
          <label class="flex items-center justify-between gap-2 bg-slate-950 border border-slate-800 rounded-lg px-2.5 py-1.5 text-xs">
            <span class="font-semibold text-slate-300">${tf.label}</span>
            <div class="flex items-center gap-1">
              <input type="number" step="0.1" min="0.05" max="30"
                     data-tf="${tf.timeframe}" value="${val}"
                     class="zz-input w-14 bg-slate-900 border border-slate-700 rounded px-1.5 py-0.5 text-right text-slate-100 tabular-nums focus:outline-none focus:border-sky-500" />
              <span class="text-slate-500">%</span>
            </div>
          </label>
        `;
      }).join('');
    }

    async function applyThresholds() {
      const inputs = document.querySelectorAll('.zz-input');
      const payload = {};
      inputs.forEach(inp => {
        const val = parseFloat(inp.value);
        if (!isNaN(val) && val > 0) {
          payload[inp.dataset.tf] = val;
        }
      });

      const res = await fetch('/api/thresholds', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ thresholds: payload }),
      });
      if (res.ok) {
        const data = await res.json();
        renderDashboard(data);
      }
    }

    async function resetThresholds() {
      const res = await fetch('/api/thresholds/reset', { method: 'POST' });
      if (res.ok) {
        const data = await res.json();
        // 清空容器強制重新渲染預設值
        document.getElementById('threshold-inputs').innerHTML = '';
        renderDashboard(data);
      }
    }
  </script>
</body>

</html>
